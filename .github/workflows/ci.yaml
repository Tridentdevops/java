name: ad

on:
    pull_request:
        branches:
            - master

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: set up java
              uses: actions/setup-java@v3
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: give execute permission for gradlew
              working-directory: ./ad
              run: chmod +x ./gradlew

            - name: Build with Gradle
              run: ./gradlew build
              #git